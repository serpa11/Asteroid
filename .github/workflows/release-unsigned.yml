name: Release unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Asteroid.xcodeproj \
            -scheme Asteroid \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Asteroid.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/Asteroid.xcarchive/Products/Applications/Asteroid.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "Asteroid-${GITHUB_REF_NAME}-unsigned.ipa" Payload

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Asteroid ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: ${{ runner.temp }}/Asteroid-${{ github.ref_name }}-unsigned.ipa
PY